[package]
name = "aux-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Rust SDK for the standalone aux Zig core"
links = "aux_zig_core"
include = ["src/**", "prebuilt/*/libaux_zig_core.a", "build.rs", "LICENSE", "NOTICE"]

[features]
async = ["dep:tokio"]
rustls = ["dep:tokio", "dep:tokio-rustls"]
monaco-models = []
hyperliquid-models = []
aster-models = []
perpl-models = []
risex-models = []
vest-models = []
decibel-models = []
edgex-models = []
grvt-models = []
katana-models = []
variational-models = []
aevo-models = []
apex-omni-models = []
backpack-models = []
binance-spot-models = []
bybit-models = []
deribit-models = []
dydx-v4-models = []
hibachi-models = []
kraken-spot-models = []
kuru-models = []
okx-models = []
orderly-models = []
reya-models = []
injective-models = []
nado-models = []
ondo-perps-models = []
pacifica-models = []
paragon-models = []
trade-xyz-models = []
arcus-models = []
databento-historical-models = []
databento-reference-models = []
metric-models = []
qfex-models = []
tardis-models = []
lighter-models = []
derive-models = []
phoenix-models = []
extended-models = []
paradex-models = []
pascal-models = []
kalshi-models = []
kalshi-perps-models = []
polymarket-models = []
polymarket-perps-models = []
hyperdash-models = []
birdeye-models = []
pyth-hermes-models = []
pyth-pro-models = []
chainlink-streams-models = []
chainlink-candles-models = []
dune-models = []

[dependencies]
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["tls12"] }
serde.workspace = true
serde_json.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
