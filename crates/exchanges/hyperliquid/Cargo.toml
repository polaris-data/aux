[package]
name = "aux-rs-hyperliquid"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Native Hyperliquid client, protocol types, and signing"

[features]
default = []
http = ["aux-rs-core/http"]
ws = ["aux-rs-core/ws"]

[dependencies]
aux-rs-core.workspace = true
serde.workspace = true
serde_json.workspace = true
k256.workspace = true
sha3.workspace = true
rmp-serde.workspace = true
hex.workspace = true
zeroize.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
