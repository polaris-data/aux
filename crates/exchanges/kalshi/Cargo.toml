[package]
name = "aux-rs-kalshi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "MIT"
repository = "https://github.com/polaris-data/connectors"
readme = "README.md"
description = "Kalshi prediction, perpetual and clearing APIs with native authentication"

[features]
default = []
http = ["aux-rs-core/http"]
ws = ["aux-rs-core/ws"]

[dependencies]
aux-rs-core.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
url.workspace = true
getrandom.workspace = true
base64.workspace = true
sha2.workspace = true
ed25519-dalek = { workspace=true, features=["pkcs8","pem"] }
rsa = { version="0.9.10", default-features=false, features=["std","pem","sha2"] }
rand = { version="0.8.5", default-features=false, features=["std","std_rng"] }

[dev-dependencies]
tokio = { workspace=true, features=["macros","rt-multi-thread","net","io-util","time","sync"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true

[lints]
workspace = true
