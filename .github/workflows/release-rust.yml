name: Profile Rust SDK compilation

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  profile:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, profile: baseline}
          - {os: macos-15-intel, profile: baseline}
          - {os: macos-15-intel, profile: no-incremental}
          - {os: macos-15, profile: baseline}
          - {os: macos-15, profile: no-incremental}
    env:
      RUSTUP_TOOLCHAIN: 1.92.0
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      AUX_BUILD_PROFILE: ${{ matrix.profile }}
      AUX_BUILD_PROFILE_OUTPUT: ${{ runner.temp }}/rust-build-profile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Download the 0.0.2 release archives
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: native-sdk-archives
          path: sdk/rust/prebuilt
          github-token: ${{ github.token }}
          run-id: 46049267787
      - name: Set up Rust
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          cargo fetch --locked
      - name: Profile cold Rust test compilation
        run: python3 tools/profile-rust-build.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rust-profile-${{ matrix.os }}-${{ matrix.profile }}
          path: ${{ env.AUX_BUILD_PROFILE_OUTPUT }}
          retention-days: 14
