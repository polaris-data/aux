name: Release TypeScript SDK
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: node-sdk-${{ github.ref }}
jobs:
  validate:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'aux-connectors-v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate npm release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 tools/check-release-version.py aux-connectors
  native:
    needs: validate
    name: Node (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'ubuntu-24.04' && 45 || 90 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install Rust
        run: rustup toolchain install 1.92.0 --profile minimal && rustup default 1.92.0
      - name: Install build tools
        run: npm ci --prefix sdk/typescript
      - name: Validate sources and declarations
        if: runner.os == 'Linux'
        run: |
          python3 tools/check_coverage.py
          sdk/typescript/node_modules/.bin/tsc --strict --noEmit --target es2022 sdk/typescript/js/index.d.ts
      - name: Build and test release addon
        run: |
          npm --prefix sdk/typescript run build
          cd sdk/typescript
          consumer=$(mktemp -d)
          npm pack --pack-destination "$consumer"
          cd "$consumer"
          echo '{"private":true}' > package.json
          npm install --ignore-scripts --offline --no-audit --no-fund ./aux-connectors-*.tgz
          node "$GITHUB_WORKSPACE/tests/packages.cjs"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: node-${{ matrix.os }}
          path: sdk/typescript/aux.*.node
          if-no-files-found: error
  package:
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: node-*
          path: sdk/typescript
          merge-multiple: true
      - name: Pack all supported platforms
        run: |
          cd sdk/typescript
          for target in darwin-arm64 darwin-x64 linux-x64-gnu; do test -s "aux.$target.node"; done
          npm pack
          cd "$(mktemp -d)"
          echo '{"private":true}' > package.json
          npm install --offline --ignore-scripts --no-audit --no-fund "$GITHUB_WORKSPACE"/sdk/typescript/aux-connectors-*.tgz
          node --input-type=module -e 'import {PhoenixClient} from "aux-connectors"; import {createRequire} from "node:module"; if (PhoenixClient !== createRequire(import.meta.url)("aux-connectors").PhoenixClient) process.exit(1)'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aux-connectors-package
          path: sdk/typescript/*.tgz
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: package
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: aux-connectors-package
          path: dist
      - name: Publish verified tarball with trusted publishing
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ "$PRERELEASE" == true ]]; then
            npm publish dist/*.tgz --tag next --access public
          else
            npm publish dist/*.tgz --access public
          fi
