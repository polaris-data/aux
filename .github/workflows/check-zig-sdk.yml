name: Check standalone Zig SDKs
on:
  pull_request:
    paths:
      - 'zig/**'
      - '.github/workflows/check-zig-sdk.yml'
  workflow_dispatch:
    inputs:
      benchmark:
        description: Time three cold and three edited builds of each SDK
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: aarch64-macos
            target: aarch64-apple-darwin
            sha: 75f1bc7a1e9852f17ec9a0c1895f767c4ec56d46bc8a834920eece1d0359dd8d
          - os: ubuntu-24.04
            arch: x86_64-linux
            target: x86_64-unknown-linux-gnu
            sha: 3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: zig
    env:
      RUSTUP_TOOLCHAIN: 1.92.0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          sparse-checkout: zig
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install pinned build tools
        env:
          ZIG_ARCH: ${{ matrix.arch }}
          SHA: ${{ matrix.sha }}
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          python -m pip install maturin==1.16.0
          version=$(cat .zigversion)
          archive="zig-$ZIG_ARCH-$version"
          curl --fail --silent --show-error --location --retry 3 "https://ziglang.org/download/$version/$archive.tar.xz" -o "$RUNNER_TEMP/$archive.tar.xz"
          printf '%s  %s\n' "$SHA" "$RUNNER_TEMP/$archive.tar.xz" | shasum -a 256 -c
          tar xf "$RUNNER_TEMP/$archive.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$archive" >> "$GITHUB_PATH"
      - name: Verify native sources and the packaged archive
        env:
          TARGET: ${{ matrix.target }}
        run: |
          zig build test
          python rebuild.py --check --target "$TARGET"
          cc tests/abi.c -Iinclude "sdk/rust/prebuilt/$TARGET/libaux_zig_core.a" -o "$RUNNER_TEMP/abi"
          "$RUNNER_TEMP/abi"
      - name: Build and exercise the Zig consumer
        run: python check_zig_sdk.py
      - name: Install and test the SDKs
        run: python check_packages.py
      - name: Save verified SDK packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aux-zig-sdk-${{ matrix.target }}
          path: zig/dist/
          if-no-files-found: error
      - name: Benchmark standalone builds on this runner
        if: github.event_name == 'workflow_dispatch' && inputs.benchmark
        run: python tools/benchmark_packages.py --output "$RUNNER_TEMP/package-builds.json"
      - name: Save package build timings
        if: github.event_name == 'workflow_dispatch' && inputs.benchmark
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aux-zig-build-times-${{ matrix.target }}
          path: ${{ runner.temp }}/package-builds.json
          if-no-files-found: error
