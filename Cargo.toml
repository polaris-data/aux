[workspace]
members = ["sdk/rust", "sdk/typescript", "sdk/python"]
default-members = ["sdk/rust"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[workspace.dependencies]
aux-rs = { version = "0.0.1", path = "sdk/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
