[package]
name = "aux-rs-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Thin Python bindings for native Rust exchange connectors"

[lib]
name = "_native"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
aux-rs = { workspace = true, features = ["hyperliquid", "lighter", "qfex", "arcus", "monaco", "derive", "paradex", "metric", "http", "ws"] }
pyo3 = { version = "0.30.1", default-features = false, features = ["macros", "multiple-pymethods"] }
pyo3-async-runtimes = { version = "0.30", default-features = false, features = ["tokio-runtime"] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros"] }
serde_json.workspace = true
serde.workspace = true
zeroize.workspace = true

[lints]
workspace = true
