[package]
name = "aux-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Native exchange and data-vendor connectors for Rust"
repository = "https://github.com/polaris-data/connectors"
license = "MIT"
readme = "../../README.md"
include = ["Cargo.toml", "src/**"]

[features]
default = ["http", "ws"]
http = ["aux-rs-pascal?/http", "aux-rs-kalshi?/http", "aux-rs-polymarket?/http", "aux-rs-metric?/http", "aux-rs-tardis?/http", "aux-rs-databento?/http", "aux-rs-core/http", "aux-rs-hyperliquid?/http", "aux-rs-lighter?/http", "aux-rs-qfex?/http", "aux-rs-arcus?/http", "aux-rs-monaco?/http", "aux-rs-derive?/http", "aux-rs-paradex?/http"]
ws = ["aux-rs-pascal?/ws", "aux-rs-kalshi?/ws", "aux-rs-polymarket?/ws", "aux-rs-tardis?/ws", "aux-rs-core/ws", "aux-rs-hyperliquid?/ws", "aux-rs-lighter?/ws", "aux-rs-qfex?/ws", "aux-rs-arcus?/ws", "aux-rs-monaco?/ws", "aux-rs-derive?/ws", "aux-rs-paradex?/ws"]
files = ["aux-rs-tardis?/files", "aux-rs-databento?/files"]
tcp = ["aux-rs-databento?/tcp"]
tardis = ["dep:aux-rs-tardis"]
databento = ["dep:aux-rs-databento"]
metric = ["dep:aux-rs-metric"]
qfex = ["dep:aux-rs-qfex"]
arcus = ["dep:aux-rs-arcus"]
monaco = ["dep:aux-rs-monaco"]
derive = ["dep:aux-rs-derive"]
paradex = ["dep:aux-rs-paradex"]
hyperliquid = ["dep:aux-rs-hyperliquid"]
lighter = ["dep:aux-rs-lighter"]

polymarket = ["dep:aux-rs-polymarket"]

kalshi = ["dep:aux-rs-kalshi"]

pascal = ["dep:aux-rs-pascal"]

[dependencies]
aux-rs-pascal = { workspace=true, optional=true }
aux-rs-kalshi = { workspace=true, optional=true }
aux-rs-polymarket = { workspace=true, optional=true }
aux-rs-tardis = { workspace = true, optional = true }
aux-rs-databento = { workspace = true, optional = true }
aux-rs-metric = { workspace = true, optional = true }
aux-rs-derive = { workspace = true, optional = true }
aux-rs-paradex = { workspace = true, optional = true }
aux-rs-monaco = { workspace = true, optional = true }
aux-rs-arcus = { workspace = true, optional = true }
aux-rs-qfex = { workspace = true, optional = true }
aux-rs-core.workspace = true
aux-rs-hyperliquid = { workspace = true, optional = true }
aux-rs-lighter = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true
serde_json.workspace = true
zeroize.workspace = true

[[example]]
name = "hyperliquid_public"
required-features = ["hyperliquid", "http", "ws"]

[[example]]
name = "hyperliquid_account"
required-features = ["hyperliquid", "http", "ws"]

[[example]]
name = "hyperliquid_testnet_trade"
required-features = ["hyperliquid", "http", "ws"]

[[example]]
name = "lighter_public"
required-features = ["lighter", "http", "ws"]

[[example]]
name = "lighter_testnet_trade"
required-features = ["lighter", "http", "ws"]

[[example]]
name = "qfex_public"
required-features = ["qfex", "http", "ws"]

[[example]]
name = "arcus_public"
required-features = ["arcus", "http", "ws"]

[[example]]
name = "monaco_public"
required-features = ["monaco", "http", "ws"]

[[example]]
name = "monaco_testnet_trade"
required-features = ["monaco", "http", "ws"]

[[example]]
name = "derive_public"
required-features = ["derive", "http", "ws"]

[[example]]
name = "paradex_public"
required-features = ["paradex", "http", "ws"]

[[example]]
name = "derive_testnet_trade"
required-features = ["derive", "http", "ws"]

[[example]]
name = "paradex_testnet_trade"
required-features = ["paradex", "http", "ws"]

[[example]]
name = "metric_public"
required-features = ["metric", "http"]

[[example]]
name = "metric_contract"
required-features = ["metric", "http"]

[lints]
workspace = true
