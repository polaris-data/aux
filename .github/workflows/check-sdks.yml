name: Check SDKs
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.92.0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify generated SDK coverage
        run: python tools/check_coverage.py
      - name: Install Zig
        run: bash tools/install-ci-zig.sh
      - name: Build the Linux native archive
        run: python rebuild.py --target x86_64-unknown-linux-gnu
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Run default Rust tests
        run: cargo test -p aux-rs --locked
