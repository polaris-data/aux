[package]
name = "aux-rs-lighter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Lighter-native protocol, Rust signing, and exchange client"

[features]
typescript = ["dep:ts-rs"]
default = []
http = ["aux-rs-core/http"]
ws = ["aux-rs-core/ws"]

[dependencies]
ts-rs = { workspace = true, optional = true }
aux-rs-core.workspace = true
serde.workspace = true
serde_json.workspace = true
goldilocks-crypto.workspace = true
poseidon-hash.workspace = true
zeroize.workspace = true
futures-util.workspace = true
getrandom.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync"] }

[lints]
workspace = true
