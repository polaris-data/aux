name: Release Rust SDK

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: rust-release-${{ github.ref }}

env:
  RUSTUP_TOOLCHAIN: 1.92.0

jobs:
  validate:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'aux-rs-v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate Rust release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 tools/check-release-version.py aux-rs

  archives:
    needs: validate
    uses: ./.github/workflows/build-native-archives.yml

  package:
    needs: archives
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Download native SDK archives
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: native-sdk-archives
          path: sdk/rust/prebuilt
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Test SDK and verify the packaged crate
        run: |
          cargo test -p aux-rs --all-features --locked
          git diff --quiet HEAD --
          cargo package -p aux-rs --locked --allow-dirty
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: runner.os == 'Linux'
        with:
          name: aux-rs-package
          path: target/package/aux-rs-*.crate
          if-no-files-found: error

  publish:
    name: Publish to crates.io
    needs: package
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Download native SDK archives
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: native-sdk-archives
          path: sdk/rust/prebuilt
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish verified revision
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          git diff --quiet HEAD --
          cargo publish --locked --allow-dirty --registry crates-io -p aux-rs
