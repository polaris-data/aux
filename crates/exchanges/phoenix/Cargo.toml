[package]
name = "aux-rs-phoenix"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "MIT"
description = "Native Phoenix exchange API client"

[features]
default = []
http = ["aux-rs-core/http"]
ws = ["aux-rs-core/ws"]
typescript = ["dep:ts-rs"]

[dependencies]
aux-rs-core.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
url.workspace = true
base64.workspace = true
ts-rs = { workspace = true, optional = true }

borsh = { version = "1.6", features = ["derive"] }
sha2.workspace = true
sha2-const-stable = "0.1"
thiserror = "2"
bs58 = "0.5"
solana-pubkey = { version = "=3.0.0", default-features = false, features = ["std", "curve25519", "sha2", "serde"] }
ed25519-dalek.workspace = true
zstd = { version = "0.13", default-features = false }

bytemuck = { version = "1", features = ["derive"] }

solana-message = { version = "=3.0.1", features = ["bincode"] }
bincode = "1.3"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true

[lints]
workspace = true
