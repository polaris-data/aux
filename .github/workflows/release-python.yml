name: Release Python SDK

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: python-release-${{ github.ref }}

jobs:
  validate:
    name: Validate release version
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'aux-py-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check Python, Rust, and release tag versions agree
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python tools/check-python-release-version.py

  wheels:
    name: Build wheel (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'macos-15' && 150 || matrix.os == 'macos-15-intel' && 90 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            interpreter: /opt/python/cp310-cp310/bin/python
            wheel_platform: manylinux_2_28_x86_64
          - os: macos-15
            interpreter: python
            wheel_platform: macosx_11_0_arm64
          - os: macos-15-intel
            interpreter: python
            wheel_platform: macosx_10_12_x86_64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: runner.os == 'macOS'
        with:
          python-version: '3.10'
      - name: Build release wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: v1.16.0
          rust-toolchain: '1.92.0'
          manylinux: '2_28'
          args: >-
            --release --locked --manifest-path sdk/python/Cargo.toml
            --interpreter ${{ matrix.interpreter }} --out dist
      - name: Verify the stable ABI wheel tag
        env:
          WHEEL_PLATFORM: ${{ matrix.wheel_platform }}
        run: |
          wheels=(dist/*.whl)
          if [[ ${#wheels[@]} != 1 || ! -f "${wheels[0]}" || ${wheels[0]} != *-cp310-abi3-"$WHEEL_PLATFORM".whl ]]; then
            printf 'Expected one cp310-abi3 wheel for %s. Found: %s\n' "$WHEEL_PLATFORM" "${wheels[*]}"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dist-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  wheel-tests:
    name: Test wheel (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: wheels
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-dist-${{ matrix.os }}
          path: dist
      - name: Install and test the built wheel
        run: |
          python -m pip install --only-binary=:all: dist/*.whl
          python -c 'import aux_py; from importlib.metadata import version; assert aux_py.__version__ == version("aux-py")'
          python -I tests/packages.py

  sdist:
    name: Source distribution
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Rust
        run: rustup toolchain install 1.92.0 --profile minimal --component rustfmt && rustup default 1.92.0
      - name: Build source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: v1.16.0
          command: sdist
          args: --manifest-path sdk/python/Cargo.toml --out dist
      - name: Install and test from the source distribution
        run: |
          python -m pip install dist/*.tar.gz
          python -c 'import aux_py; from importlib.metadata import version; assert aux_py.__version__ == version("aux-py")'
          python -I tests/packages.py
      - name: Verify generated SDK coverage
        run: python tools/check_coverage.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: [wheel-tests, sdist]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/aux-py/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: python-dist-*
          path: dist
          merge-multiple: true
      - name: Publish distributions with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
