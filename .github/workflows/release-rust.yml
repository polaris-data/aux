name: Release Rust SDK

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: rust-release-${{ github.ref }}

env:
  RUSTUP_TOOLCHAIN: 1.92.0

jobs:
  validate:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'aux-rs-v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate Rust release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 tools/check-release-version.py aux-rs

  package:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            native_check_target: x86_64-unknown-linux-gnu
          - os: macos-15
            native_check_target: aarch64-apple-darwin
          - os: macos-15-intel
            native_check_target: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Install Zig
        if: matrix.native_check_target != ''
        run: bash tools/install-ci-zig.sh
      - name: Verify the bundled native archive and its C ABI
        if: matrix.native_check_target != ''
        env:
          TARGET: ${{ matrix.native_check_target }}
        run: |
          python3 rebuild.py --check --target "$TARGET"
          cc tests/abi.c -Iinclude "sdk/rust/prebuilt/$TARGET/libaux_zig_core.a" -o "$RUNNER_TEMP/abi"
          "$RUNNER_TEMP/abi"
      - name: Test SDK and verify the packaged crate
        env:
          CARGO_PROFILE_TEST_DEBUG: line-tables-only
        run: |
          cargo test -p aux-rs --all-features --locked
          cargo package -p aux-rs --locked
      - name: Exercise the verified crate in independent consumers
        if: matrix.native_check_target != ''
        run: python3 check_packages.py --rust-crate target/package/aux-rs-*.crate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: runner.os == 'Linux'
        with:
          name: aux-rs-package
          path: target/package/aux-rs-*.crate
          if-no-files-found: error

  publish:
    name: Publish to crates.io
    needs: package
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish verified revision
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --registry crates-io -p aux-rs
